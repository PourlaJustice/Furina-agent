<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏰ 芙宁娜闹钟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
    }
    #alarm {
      position: fixed;
      inset: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(10, 14, 26, 0.55);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(160, 130, 255, 0.35);
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      padding: 20px;
      text-align: center;
      color: #fff;
    }
    .alarm-icon {
      font-size: 44px;
      animation: ring 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(255, 200, 90, 0.6));
    }
    @keyframes ring {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }
    .alarm-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffe9b0;
    }
    .alarm-text {
      font-size: 15px;
      color: #eef2ff;
      max-width: 90%;
      line-height: 1.5;
      word-break: break-all;
    }
    .alarm-time {
      font-size: 12px;
      color: #9aa8d8;
    }
    .alarm-buttons {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .alarm-buttons button {
      -webkit-app-region: no-drag;
      border: 1px solid rgba(140, 160, 255, 0.3);
      background: rgba(120, 150, 255, 0.14);
      color: #eef2ff;
      font-size: 13px;
      border-radius: 10px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.12s ease;
    }
    .alarm-buttons button:hover {
      background: rgba(120, 150, 255, 0.32);
      transform: scale(1.05);
    }
    .alarm-buttons button.snooze {
      border-color: rgba(255, 180, 90, 0.4);
      background: rgba(255, 180, 90, 0.12);
      color: #ffe9b0;
    }
    .alarm-buttons button.snooze:hover {
      background: rgba(255, 180, 90, 0.28);
    }
  </style>
</head>
<body>
  <div id="alarm">
    <div class="alarm-icon">⏰</div>
    <div class="alarm-title">叮咚——时间到啦！</div>
    <div class="alarm-text" id="alarm-text"></div>
    <div class="alarm-time" id="alarm-time"></div>
    <div class="alarm-buttons">
      <button id="alarm-ok">知道了</button>
      <button id="alarm-snooze" class="snooze">稍后 5 分钟</button>
    </div>
  </div>
  <audio id="bgm" loop></audio>
  <script type="module" src="./alarm.ts"></script>
</body>
</html>
